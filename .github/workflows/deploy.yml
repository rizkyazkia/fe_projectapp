name: Deploy Frontend to rumahweb

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: rumahweb-fe-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Replace node_modules with server.js's actual runtime deps
        run: |
          # server.js only ever imports express and http-proxy-middleware -
          # everything else in package.json's dependencies (React, Tailwind,
          # Tiptap, recharts, etc.) is build-time only and already baked into
          # dist/*.js. Uploading the full tree made the SCP step transfer
          # tens of thousands of unnecessary files and made it more exposed
          # to this host's flaky-connection history. Install a minimal
          # node_modules in isolation instead, leaving the real package.json
          # (needed on the server for its "type": "module" field) untouched.
          rm -rf node_modules
          mkdir -p /tmp/server-deps
          cp package.json /tmp/server-deps/
          node -e "
            const fs = require('fs');
            const path = '/tmp/server-deps/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.dependencies = {
              express: pkg.dependencies.express,
              'http-proxy-middleware': pkg.dependencies['http-proxy-middleware'],
            };
            delete pkg.devDependencies;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2));
          "
          cd /tmp/server-deps
          npm install --omit=dev
          cp -r node_modules "$GITHUB_WORKSPACE/node_modules"

      - name: Stage deploy artifact
        run: |
          set -e
          rm -rf .deploy
          mkdir -p .deploy
          cp -r dist server.js package.json package-lock.json node_modules .deploy/
          mkdir -p .deploy/tmp
          date > .deploy/tmp/restart.txt
          # node_modules is built and pruned to production dependencies
          # entirely on the GitHub Actions runner and uploaded as-is - npm
          # install/ci is never run on the server itself, since this
          # shared-hosting account's resource limits can't sustain it (the
          # same crash - exit 134/SIGABRT - that the backend deploy hit
          # before it switched to this same pattern).
          #
          # rumahweb support confirmed SSH/SCP from GitHub Actions is not
          # reliably supported on this shared-hosting account, and directed
          # us to FTP instead - hence this step's deploy transport (same
          # switch made on the backend deploy pipeline).
          # tmp/restart.txt is included in the upload itself (rather than a
          # separate SSH-triggered touch) since Passenger only needs its
          # mtime bumped, which a fresh upload already does.

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.RUMAHWEB_FTP_HOST }}
          username: ${{ secrets.RUMAHWEB_FTP_USER }}
          password: ${{ secrets.RUMAHWEB_FTP_PASSWORD }}
          port: ${{ secrets.RUMAHWEB_FTP_PORT }}
          server-dir: ${{ secrets.RUMAHWEB_FE_PATH }}/
          local-dir: ./.deploy/
          protocol: ftps
          security: loose
          log-level: standard
          # FTP-Deploy-Action excludes node_modules by default; the previous
          # step builds node_modules specifically to be uploaded as-is, so
          # that default exclusion must be turned off.
          exclude: |
            **/.git*
            **/.git*/**

      - name: Sync FTP upload into live directory
        env:
          SSH_HOST: ${{ secrets.RUMAHWEB_SSH_HOST }}
          SSH_USER: ${{ secrets.RUMAHWEB_SSH_USER }}
          SSH_PORT: ${{ secrets.RUMAHWEB_SSH_PORT }}
          DOMAIN: ${{ secrets.RUMAHWEB_FE_PATH }}
        run: |
          set -e
          # The ftp_jalinananaksehat FTP account used by "Deploy via FTP" is
          # jailed to public_html/<domain>/ftp_jalinananaksehat/ - a
          # different directory tree than the live app root ($HOME/<domain>/,
          # where the Node app in server.js actually runs from, matching the
          # $HOME/$DOMAIN pattern the next step already relies on). FTP
          # jails can't be pointed outside their own root, so every FTP
          # upload lands in the jail and has to be mirrored server-side into
          # the live directory over SSH before it's actually live.
          mkdir -p ~/.ssh
          echo "${{ secrets.RUMAHWEB_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          cat > sync.sh <<'SCRIPT'
          #!/bin/bash
          set -e
          DOMAIN="$1"
          SRC="$HOME/public_html/$DOMAIN/ftp_jalinananaksehat/$DOMAIN"
          DEST="$HOME/$DOMAIN"
          for item in dist server.js package.json package-lock.json node_modules tmp; do
            rm -rf "${DEST:?}/$item"
            cp -r "$SRC/$item" "$DEST/$item"
          done
          SCRIPT

          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            sync.sh "$SSH_USER@$SSH_HOST:~/sync-fe.sh"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "bash ~/sync-fe.sh '$DOMAIN'; rm -f ~/sync-fe.sh"

      - name: Recycle stale Node worker
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.RUMAHWEB_SSH_HOST }}
          SSH_USER: ${{ secrets.RUMAHWEB_SSH_USER }}
          SSH_PORT: ${{ secrets.RUMAHWEB_SSH_PORT }}
          DOMAIN: ${{ secrets.RUMAHWEB_FE_PATH }}
        run: |
          set -e
          # Passenger/LiteSpeed here doesn't replace the old worker on
          # restart - it spawns a new one alongside it, leaking threads
          # every deploy. This snapshots pre-deploy worker PIDs, hits the
          # app once to force a respawn against the fresh restart.txt, and
          # only kills the old PIDs if a genuinely new one is confirmed up -
          # never kills blindly, so a slow/failed respawn can't cause downtime.
          mkdir -p ~/.ssh
          echo "${{ secrets.RUMAHWEB_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          cat > recycle.sh <<'SCRIPT'
          #!/bin/bash
          DOMAIN="$1"
          PATTERN="lsnode:$HOME/$DOMAIN/"
          OLD_PIDS=$(pgrep -f "$PATTERN" || true)
          OLD_COUNT=$(echo "$OLD_PIDS" | grep -c . || true)
          curl -s -o /dev/null -k "https://$DOMAIN/" || true
          sleep 4
          NEW_PIDS=$(pgrep -f "$PATTERN" || true)
          NEW_COUNT=$(echo "$NEW_PIDS" | grep -c . || true)
          if [ "$NEW_COUNT" -gt "$OLD_COUNT" ] && [ -n "$OLD_PIDS" ]; then
            echo "$OLD_PIDS" | while read -r pid; do
              [ -z "$pid" ] && continue
              kill "$pid" 2>/dev/null && echo "killed stale worker $pid" || true
            done
          else
            echo "no new worker confirmed (old=$OLD_COUNT new=$NEW_COUNT), skipping cleanup"
          fi
          SCRIPT

          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            recycle.sh "$SSH_USER@$SSH_HOST:~/recycle-fe.sh"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "bash ~/recycle-fe.sh '$DOMAIN'; rm -f ~/recycle-fe.sh"
